[project]
name = "semaninha"
version = "2.0.0"
description = "CLI interativa: grids de álbuns do Last.fm com ratings do RateYourMusic"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "Pillow>=10.0.0",
    "questionary>=2.0.0",
]

[project.scripts]
semaninha = "semaninha:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["semaninha", "weekly_music_grid"]
